<!doctype html><title>Lever-style form (local replica, written from memory)</title><body>
<form id="application-form"><h4>Submit your application</h4><ul>
<li class="application-question"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
<div class="application-field"><a class="postings-btn">ATTACH RESUME/CV<input class="application-file-input" id="resume-upload-input" type="file" name="resume" style="position:absolute;opacity:0;width:1px;height:1px"></a></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
<li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
<li class="application-question"><label><div class="application-label">Current location</div><div class="application-field"><input type="text" name="location" id="location-input"></div></label></li>
<li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
</ul><h4>Links</h4><ul>
<li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
<li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
<li class="application-question"><label><div class="application-label">Other website</div><div class="application-field"><input type="text" name="urls[Other]"></div></label></li>
</ul><h4>Questions</h4><ul>
<li class="application-question"><label><div class="application-label">What excites you about this role?</div><div class="application-field"><textarea name="cards[abc][field0]"></textarea></div></label></li>
<li class="application-question"><label><div class="application-label">Will you now or in the future require visa sponsorship?</div><div class="application-field"><select name="cards[abc][field1]"><option value="">Select...</option><option>Yes</option><option>No</option></select></div></label></li>
</ul><h4>U.S. Equal Employment Opportunity information</h4>
<label><div>Gender</div><select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option></select></label>
<label><div>Race</div><select name="eeo[race]"><option value="">Select ...</option><option>Asian</option></select></label>
<label><div>Additional information</div><textarea name="comments"></textarea></label>
<button type="submit">Submit application</button></form>
